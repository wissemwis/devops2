<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>
<meta name="description" content="Notre site arrive bientôt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #05060a;
    --bg-1: #0b0d17;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --text-hi: #f5f6fb;
    --text-lo: #9aa0b4;
    --card-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-0);
    color: var(--text-hi);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 24px;
  }

  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .glow-1 {
    width: 520px;
    height: 520px;
    top: -160px;
    left: -160px;
    background: var(--accent);
    animation: float1 16s ease-in-out infinite;
  }

  .glow-2 {
    width: 480px;
    height: 480px;
    bottom: -180px;
    right: -140px;
    background: var(--accent-2);
    animation: float2 18s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 40px) scale(1.1); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, -30px) scale(1.08); }
  }

  .noise {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.03);
    font-size: 13px;
    color: var(--text-lo);
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }

  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px var(--accent-2);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  h1 {
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #ffffff 0%, #c9c9e8 55%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
  }

  p.lead {
    font-size: clamp(1rem, 2vw, 1.15rem);
    color: var(--text-lo);
    max-width: 480px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }

  .countdown {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 44px;
    flex-wrap: wrap;
  }

  .countdown .unit {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    min-width: 78px;
    backdrop-filter: blur(6px);
  }

  .countdown .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .countdown .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-lo);
    margin-top: 4px;
  }

  form {
    display: flex;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  }

  input[type="email"] {
    flex: 1 1 240px;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-hi);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input[type="email"]::placeholder {
    color: var(--text-lo);
  }

  input[type="email"]:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.06);
  }

  button {
    padding: 14px 26px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #05060a;
    font-weight: 600;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
  }

  button:active {
    transform: translateY(0);
  }

  .form-msg {
    margin-top: 14px;
    font-size: 13px;
    color: var(--accent-2);
    min-height: 18px;
  }

  .social {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 52px;
  }

  .social a {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    color: var(--text-lo);
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .social a:hover {
    color: var(--text-hi);
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.1);
  }

  .social svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-lo);
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .countdown .unit { min-width: 64px; padding: 12px 10px; }
    .countdown .num { font-size: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="noise"></div>

  <div class="container">
    <span class="badge"><span class="dot"></span>On travaille dessus</span>

    <h1>On arrive bientôt.</h1>
    <p class="lead">Notre nouveau site est en cours de construction. Laissez votre email pour être averti dès l'ouverture.</p>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="label">Jours</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="label">Heures</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="label">Min</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="label">Sec</div></div>
    </div>

    <form id="notify-form">
      <input type="email" id="email" placeholder="votre@email.com" required autocomplete="email">
      <button type="submit">M'avertir</button>
    </form>
    <div class="form-msg" id="form-msg"></div>

    <div class="social">
      <a href="#" aria-label="Twitter / X">
        <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7l-5.5-7.2L4.4 22H1.3l8.1-9.3L1 2h7.2l5 6.6L18.9 2zm-1.2 18h1.7L7.4 4H5.6l12.1 16z"/></svg>
      </a>
      <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><path d="M12 2c2.7 0 3.05.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.22.6 1.77 1.15.55.55.9 1.11 1.15 1.77.25.64.42 1.37.47 2.43.05 1.07.06 1.42.06 4.12s-.01 3.05-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.64.25-1.37.42-2.43.47-1.07.05-1.42.06-4.12.06s-3.05-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.05 2 14.7 2 12s.01-3.05.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.22 1.15-1.77A4.9 4.9 0 0 1 5.45 2.53c.64-.25 1.37-.42 2.43-.47C8.95 2.01 9.3 2 12 2zm0 1.8c-2.65 0-2.97.01-4.02.06-.87.04-1.34.18-1.65.3-.42.16-.71.35-1.02.66-.31.31-.5.6-.66 1.02-.12.31-.26.78-.3 1.65C4.3 6.53 4.29 6.85 4.29 9.5v5c0 2.65.01 2.97.06 4.02.04.87.18 1.34.3 1.65.16.42.35.71.66 1.02.31.31.6.5 1.02.66.31.12.78.26 1.65.3 1.05.05 1.37.06 4.02.06s2.97-.01 4.02-.06c.87-.04 1.34-.18 1.65-.3.42-.16.71-.35 1.02-.66.31-.31.5-.6.66-1.02.12-.31.26-.78.3-1.65.05-1.05.06-1.37.06-4.02v-5c0-2.65-.01-2.97-.06-4.02-.04-.87-.18-1.34-.3-1.65a2.75 2.75 0 0 0-.66-1.02 2.75 2.75 0 0 0-1.02-.66c-.31-.12-.78-.26-1.65-.3C14.97 3.81 14.65 3.8 12 3.8zm0 3.7a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 1.8a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4zm5.73-1.95a1.05 1.05 0 1 1-2.1 0 1.05 1.05 0 0 1 2.1 0z"/></svg>
      </a>
      <a href="#" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.24 8.25h4.48V23H.24V8.25zM8.47 8.25h4.3v2.01h.06c.6-1.13 2.06-2.32 4.24-2.32 4.53 0 5.37 2.98 5.37 6.86V23h-4.48v-6.4c0-1.53-.03-3.5-2.13-3.5-2.13 0-2.46 1.66-2.46 3.38V23H8.47V8.25z"/></svg>
      </a>
    </div>

    <footer>&copy; <span id="year"></span> — Tous droits réservés.</footer>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Countdown: adjust the target date as needed.
    var target = new Date();
    target.setDate(target.getDate() + 14);

    function tick() {
      var diff = Math.max(0, target - new Date());
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      document.getElementById('days').textContent = String(d).padStart(2, '0');
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);

    document.getElementById('notify-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('form-msg');
      msg.textContent = 'Merci ! Vous serez averti dès le lancement.';
      this.reset();
    });
  </script>
</body>
</html>
